name: "CI — sprint"
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: pip install .
      - run: pytest -v

  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Kein Preismaterial in public-relevanten Dateien"
        run: |
          if grep -rniE "\b(CHF|[0-9]{3,}\.[0-9]{2}|kalkulation|marge|preismaterial|preisstrat)/" \
            --include="*.md" --include="*.py" --include="*.yml" --include="*.yaml" . \
            --exclude-dir=.git --exclude=CONTRIBUTING.md --exclude=README.md 2>/dev/null; then
            echo "⚠ Preismaterial in public-Sicht gefunden — PR-Breaker"
            exit 1
          else
            echo "✓ Kein Preismaterial in public-relevanten Dateien."
          fi
      - name: "README-Struktur ≤200 Zeilen, Hook als erster Satz"
        run: |
          LINES=$(wc -l < README.md)
          echo "README.md: $LINES Zeilen"
          [ "$LINES" -le 200 ] || { echo "FAIL: >200 Zeilen"; exit 1; }
          FIRST=$(head -1 README.md)
          echo "Erster Satz: $FIRST"

[project]
name = "sprint"
version = "0.1.0"
description = "Ein Prototyp in unter 60 Minuten — in einer effimeren, isolierten Um­gebung. Kein Cloud, null Vendor-Lock-in."
authors = [{name = "GRADweight GmbH"}]
license = {text = "MIT"}
requires-python = ">=3.11"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
sprint = "sprint.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
